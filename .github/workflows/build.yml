name: Build Desktop App

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Windows executable
        run: npm run package -- --win
        env:
          # electron-builder downloads winCodeSign/NSIS from GitHub releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      # Boot the real unpacked exe — proves it launches on Windows, not
      # just that it packaged. Exits 0 via CUPID_SMOKE_TEST; kill after 60s.
      - name: Smoke test unpacked build
        shell: pwsh
        run: |
          $env:CUPID_SMOKE_TEST = '1'
          $exe = Get-ChildItem -Recurse out\win-unpacked -Filter "*.exe" | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $exe) { Write-Error "no exe found in out\win-unpacked"; exit 1 }
          Write-Host "smoke-testing $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru -RedirectStandardOutput "$env:TEMP\cupid-smoke.log" -RedirectStandardError "$env:TEMP\cupid-smoke-err.log"
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            Write-Error "app did not exit within 60s (smoke hang)"
            Get-Content "$env:TEMP\cupid-smoke.log" -ErrorAction SilentlyContinue
            exit 1
          }
          Get-Content "$env:TEMP\cupid-smoke.log" -ErrorAction SilentlyContinue
          Get-Content "$env:TEMP\cupid-smoke-err.log" -ErrorAction SilentlyContinue
          exit $p.ExitCode
      
      # Playwright drives the real unpacked exe: window-mode toggle, panel
      # render checks, userData seed, cupid-local protocol — with screenshots.
      - name: Playwright smoke + screenshots
        run: node tests/electron-smoke.cjs
      
      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-shots
          path: smoke-shots/
          retention-days: 3
          if-no-files-found: warn
      
      # Only the NSIS installer — all of out/ is ~3 GB (bundled audio) and
      # blows the private-repo artifact quota
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.exe
          retention-days: 7
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: npm install
      
      # macOS builds locally on the dev machine — CI just validates it compiles.
      # (No artifact: the .app is ~1.7 GB bundled-audio and blows the quota.)
      - name: Build macOS app
        run: npm run package -- --mac
